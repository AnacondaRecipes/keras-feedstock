{% set name = "keras" %}
{% set version = "3.15.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}-team/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f3d236aef5d77d706ef9a2b5e1af9e0af4b319e81877c3b6506eadf4a28f2781

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-build-isolation -v
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.0
  run:
    - python
    - absl-py
    - numpy
    - rich
    - namex
    - h5py
    - optree
    - ml_dtypes
    - packaging
  run_constrained:
    # https://github.com/keras-team/keras/blob/v3.15.0/requirements.txt
    - tensorflow-base >=2.20.0
    # leaving as lower bounds for now as compatibility is not well documented, with conflicting bounds in requirements files.
    - pytorch >=2.6.0
    # 0.8.1 is the latest available version that is compatible with other dependencies
    - jax >=0.8.1
    # https://github.com/keras-team/keras/blob/v3.15.0/requirements-common.txt
    - onnxscript !=0.3.2

test:
  source_files:
    - pyproject.toml
    - integration_tests
  requires:
    - pip
    # To avoid ERROR: Flag 'leave_barriers_on_recoverable_agent_restart' was defined more than once but with differing types.
    - jax  # [py==314]
    - tensorflow-base  # [py<314]
    - pytorch
    - pytest
  commands:
    - pip check
    # JAX backend (set KERAS_BACKEND in Python so tests work on Windows cmd/PowerShell)
    - python -c "import os; os.environ['KERAS_BACKEND']='jax'; import keras, keras.backend, keras.datasets, keras.layers, keras.utils"  # [py==314]
    - python -c "import os, sys, subprocess; os.environ['KERAS_BACKEND']='jax'; subprocess.check_call([sys.executable, 'integration_tests/jax_custom_fit_test.py'])"  # [py==314]
    # PyTorch backend
    - python -c "import os; os.environ['KERAS_BACKEND']='torch'; import keras, keras.backend, keras.datasets, keras.layers, keras.utils"
    - python -c "import os, sys, subprocess; os.environ['KERAS_BACKEND']='torch'; subprocess.check_call([sys.executable, '-m', 'pytest', 'integration_tests/torch_workflow_test.py'])"
    - python -c "import os, sys, subprocess; os.environ['KERAS_BACKEND']='torch'; subprocess.check_call([sys.executable, 'integration_tests/torch_custom_fit_test.py'])"
    # TensorFlow backend
    - python -c "import os; os.environ['KERAS_BACKEND']='tensorflow'; import keras, keras.backend, keras.datasets, keras.layers, keras.utils"  # [py<314]
    - python -c "import os, sys, subprocess; os.environ['KERAS_BACKEND']='tensorflow'; subprocess.check_call([sys.executable, 'integration_tests/tf_distribute_training_test.py'])"  # [py<314]
    - python -c "import os, sys, subprocess; os.environ['KERAS_BACKEND']='tensorflow'; subprocess.check_call([sys.executable, 'integration_tests/tf_custom_fit_test.py'])"  # [py<314]

about:
  home: https://github.com/keras-team/keras
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Deep Learning for humans
  description: |
    Keras 3 is a multi-backend deep learning framework, with support for JAX,
    TensorFlow, and PyTorch. Effortlessly build and train models for computer
    vision, natural language processing, audio processing, timeseries forecasting,
    recommender systems, etc.
  doc_url: https://keras.io
  dev_url: https://github.com/keras-team/keras

extra:
  skip-lints:
    - missing_imports_or_run_test_py # import tests in commands section
  recipe-maintainers:
    - ericdill
    - mariusvniekerk
    - croth1
    - ocefpaf
    - jjhelmus